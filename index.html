<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #020617, #0f172a, #020617);
            min-height: 100vh;
        }
        
        .verse-wrapper {
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .verse-text {
            display: inline;
        }
        
        .verse-number {
            font-weight: 600;
            color: #fbbf24;
            font-size: 0.75rem;
            vertical-align: super;
            margin-right: 0.25rem;
            cursor: pointer;
            user-select: none;
        }
        
        .verse-content {
            display: inline;
            cursor: pointer;
            padding: 2px 0;
            transition: all 0.2s;
        }
        
        .verse-content:hover {
            background-color: rgba(251, 191, 36, 0.1);
            border-radius: 3px;
        }
        
        .verse-highlighted {
            background-color: rgba(251, 191, 36, 0.25);
            border-radius: 3px;
            padding: 2px 4px;
        }
        
        .verse-actions {
            display: inline-flex;
            gap: 0.25rem;
            margin-left: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .verse-wrapper:hover .verse-actions {
            opacity: 1;
        }
        
        .highlight-color {
            width: 1rem;
            height: 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .highlight-color:hover {
            transform: scale(1.2);
            border-color: white;
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <div class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800/50 sticky top-0 z-10 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <h1 class="text-2xl font-bold">Bible Study</h1>
                </div>
                
                <button id="highlights-tab-btn" onclick="toggleHighlightsPanel()" class="flex items-center gap-2 bg-slate-800/50 hover:bg-slate-700/50 px-4 py-2 rounded-lg border border-slate-700/50 transition-all">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                    </svg>
                    <span>Highlights</span>
                    <span id="highlights-count" class="bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
            <div id="breadcrumb" class="flex items-center gap-2 mt-3 text-sm text-slate-300"></div>
        </div>
    </div>

    <!-- Highlights Panel -->
    <div id="highlights-panel" class="hidden fixed top-20 right-4 w-96 max-h-[80vh] bg-slate-900/95 backdrop-blur-sm border border-slate-700/50 rounded-lg shadow-2xl overflow-hidden z-50">
        <div class="bg-slate-800/50 p-4 border-b border-slate-700/50 flex items-center justify-between">
            <h3 class="font-bold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                </svg>
                Highlighted Verses
            </h3>
            <button onclick="toggleHighlightsPanel()" class="text-slate-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="highlights-content" class="overflow-y-auto max-h-[calc(80vh-5rem)] p-4">
            <div class="text-slate-400 text-center py-8">No highlighted verses yet</div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-slate-800 rounded-lg p-6 flex items-center gap-3">
            <svg class="animate-spin h-6 w-6 text-amber-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Loading Bible content...</span>
        </div>
    </div>

    <!-- Highlight Color Picker Modal -->
    <div id="highlight-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-lg p-6 max-w-sm w-full">
            <h3 class="text-lg font-bold text-white mb-4">Choose Highlight Color</h3>
            <div class="grid grid-cols-5 gap-3 mb-4">
                <button onclick="selectHighlight('yellow')" class="highlight-color" style="background-color: rgba(251, 191, 36, 0.4);" title="Yellow"></button>
                <button onclick="selectHighlight('green')" class="highlight-color" style="background-color: rgba(34, 197, 94, 0.4);" title="Green"></button>
                <button onclick="selectHighlight('blue')" class="highlight-color" style="background-color: rgba(59, 130, 246, 0.4);" title="Blue"></button>
                <button onclick="selectHighlight('purple')" class="highlight-color" style="background-color: rgba(168, 85, 247, 0.4);" title="Purple"></button>
                <button onclick="selectHighlight('pink')" class="highlight-color" style="background-color: rgba(236, 72, 153, 0.4);" title="Pink"></button>
                <button onclick="selectHighlight('red')" class="highlight-color" style="background-color: rgba(239, 68, 68, 0.4);" title="Red"></button>
                <button onclick="selectHighlight('orange')" class="highlight-color" style="background-color: rgba(249, 115, 22, 0.4);" title="Orange"></button>
                <button onclick="selectHighlight('teal')" class="highlight-color" style="background-color: rgba(20, 184, 166, 0.4);" title="Teal"></button>
                <button onclick="selectHighlight('cyan')" class="highlight-color" style="background-color: rgba(6, 182, 212, 0.4);" title="Cyan"></button>
                <button onclick="selectHighlight('lime')" class="highlight-color" style="background-color: rgba(132, 204, 22, 0.4);" title="Lime"></button>
            </div>
            <button onclick="closeHighlightModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors">
                Cancel
            </button>
        </div>
    </div>
    <div id="notes-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                    <span id="notes-verse-title">Notes</span>
                </h3>
                <button onclick="closeNotesModal()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="notes-verse-text" class="bg-slate-900/50 rounded-lg p-4 mb-4 text-slate-300 border border-slate-700/50"></div>
            
            <textarea 
                id="note-textarea" 
                class="w-full h-64 bg-slate-900/50 text-slate-200 border border-slate-600/50 rounded-lg p-3 resize-none focus:outline-none focus:border-amber-500 transition-colors mb-4" 
                placeholder="Write your notes here..."
            ></textarea>
            
            <div class="flex gap-3">
                <button onclick="saveNote()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-medium transition-colors">
                    Save Note
                </button>
                <button onclick="closeNotesModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Testament Selection -->
        <div id="testament-selection" class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto mt-12">
            <button onclick="selectTestament('Old Testament')" class="bg-gradient-to-br from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">Old Testament</h2>
                <p class="text-amber-100">Hebrew Scriptures</p>
            </button>
            <button onclick="selectTestament('New Testament')" class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">New Testament</h2>
                <p class="text-blue-100">Greek Scriptures</p>
            </button>
        </div>

        <!-- Book Selection -->
        <div id="book-selection" class="hidden">
            <button onclick="goBackToTestament()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Testament Selection
            </button>
            <div id="books-grid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </div>

        <!-- Chapter Selection -->
        <div id="chapter-selection" class="hidden">
            <button onclick="goBackToBooks()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Book Selection
            </button>
            <div id="chapters-grid" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2"></div>
        </div>

        <!-- Chapter View -->
        <div id="chapter-view" class="hidden">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <button onclick="goBackToChapters()" class="text-amber-400 hover:text-amber-300 flex items-center gap-2">
                    ← Back to Chapter Selection
                </button>
                
                <div class="flex flex-wrap gap-2 items-center">
                    <label class="text-slate-300 text-sm">Translation:</label>
                    <select id="translation-select" onchange="changeTranslation()" class="bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-500">
                       <option value="KJV">KJV - King James Version</option>
                       <option value="WEB">WEB - World English Bible</option>
                       <option value="BBE">BSB - Berean Standard Bible</option>
                       <option value="ASV">ASV - American Standard Version</option>
                       <option value="YLT">YLT - Young's Literal Translation</option>
                       <option value="JPKJV">JPKJV - Japanese Colloquial Bible</option>
                       <option value="CUV">CUV - Chinese Union Version</option>
                       <option value="RVR">BTX3 - La Biblia Textual 3ra Edicion</option>
                       <option value="VUL">VULG - Latin Vulgate</option>
                    </select>
                </div>
            </div>

            <div id="content-area" class="max-w-4xl mx-auto"></div>
        </div>
    </div>

    <script>
    // State management
    let state = {
        selectedTestament: null,
        selectedBook: null, // This will now hold the full object from our merged data
        selectedChapter: null,
        selectedVerse: null,
        selectedVerseText: '',
        notes: {},
        highlights: {},
        currentNote: '',
        selectedTranslation: 'WEB',
        versesCache: {},
        currentVerses: {},
        highlightingVerse: null,
        bookMap: null // Will hold the loaded universalBookMap
    };

    // Hardcoded Chapter Counts (kept for structure, will be merged with JSON map)
    // Note: We only need the Name (to match the map) and the Chapters count.
    const oldTestamentBase = [
        { name: 'Genesis', chapters: 50 }, { name: 'Exodus', chapters: 40 }, { name: 'Leviticus', chapters: 27 },
        { name: 'Numbers', chapters: 36 }, { name: 'Deuteronomy', chapters: 34 }, { name: 'Joshua', chapters: 24 },
        { name: 'Judges', chapters: 21 }, { name: 'Ruth', chapters: 4 }, { name: '1 Samuel', chapters: 31 },
        { name: '2 Samuel', chapters: 24 }, { name: '1 Kings', chapters: 22 }, { name: '2 Kings', chapters: 25 },
        { name: '1 Chronicles', chapters: 29 }, { name: '2 Chronicles', chapters: 36 }, { name: 'Ezra', chapters: 10 },
        { name: 'Nehemiah', chapters: 13 }, { name: 'Esther', chapters: 10 }, { name: 'Job', chapters: 42 },
        { name: 'Psalms', chapters: 150 }, { name: 'Proverbs', chapters: 31 }, { name: 'Ecclesiastes', chapters: 12 },
        { name: 'Song of Solomon', chapters: 8 }, { name: 'Isaiah', chapters: 66 }, { name: 'Jeremiah', chapters: 52 },
        { name: 'Lamentations', chapters: 5 }, { name: 'Ezekiel', chapters: 48 }, { name: 'Daniel', chapters: 12 },
        { name: 'Hosea', chapters: 14 }, { name: 'Joel', chapters: 3 }, { name: 'Amos', chapters: 9 },
        { name: 'Obadiah', chapters: 1 }, { name: 'Jonah', chapters: 4 }, { name: 'Micah', chapters: 7 },
        { name: 'Nahum', chapters: 3 }, { name: 'Habakkuk', chapters: 3 }, { name: 'Zephaniah', chapters: 3 },
        { name: 'Haggai', chapters: 2 }, { name: 'Zechariah', chapters: 14 }, { name: 'Malachi', chapters: 4 }
    ];

    const newTestamentBase = [
        { name: 'Matthew', chapters: 28 }, { name: 'Mark', chapters: 16 }, { name: 'Luke', chapters: 24 },
        { name: 'John', chapters: 21 }, { name: 'Acts', chapters: 28 }, { name: 'Romans', chapters: 16 },
        { name: '1 Corinthians', chapters: 16 }, { name: '2 Corinthians', chapters: 13 }, { name: 'Galatians', chapters: 6 },
        { name: 'Ephesians', chapters: 6 }, { name: 'Philippians', chapters: 4 }, { name: 'Colossians', chapters: 4 },
        { name: '1 Thessalonians', chapters: 5 }, { name: '2 Thessalonians', chapters: 3 }, { name: '1 Timothy', chapters: 6 },
        { name: '2 Timothy', chapters: 4 }, { name: 'Titus', chapters: 3 }, { name: 'Philemon', chapters: 1 },
        { name: 'Hebrews', chapters: 13 }, { name: 'James', chapters: 5 }, { name: '1 Peter', chapters: 5 },
        { name: '2 Peter', chapters: 3 }, { name: '1 John', chapters: 5 }, { name: '2 John', chapters: 1 },
        { name: '3 John', chapters: 1 }, { name: 'Jude', chapters: 1 }, { name: 'Revelation', chapters: 22 }
    ];

    // These will be populated after loading the JSON
    let oldTestament = [];
    let newTestament = [];
    const highlightColors = {
        yellow: 'rgba(251, 191, 36, 0.4)', green: 'rgba(34, 197, 94, 0.4)', blue: 'rgba(59, 130, 246, 0.4)',
        purple: 'rgba(168, 85, 247, 0.4)', pink: 'rgba(236, 72, 153, 0.4)', red: 'rgba(239, 68, 68, 0.4)',
        orange: 'rgba(249, 115, 22, 0.4)', teal: 'rgba(20, 184, 166, 0.4)', cyan: 'rgba(6, 182, 212, 0.4)',
        lime: 'rgba(132, 204, 22, 0.4)'
    };

    window.onload = async function() {
        showLoading();
        await loadBookMap(); // Load JSON
        initializeBookData(); // Merge JSON with Chapter counts
        loadNotes();
        loadHighlights();
        updateHighlightsCount();
        hideLoading();
    };

    // Load the universalBookMap.json file
    async function loadBookMap() {
        try {
            const response = await fetch('universalBookMap.json');
            if (!response.ok) throw new Error('Failed to load book map');
            state.bookMap = await response.json();
            console.log("Book Map Loaded", state.bookMap);
        } catch (e) {
            console.error("Could not load universalBookMap.json", e);
            // Fallback: alert user or handle gracefully
        }
    }

    // Merge the loaded JSON map with our hardcoded chapter counts
    function initializeBookData() {
        if (!state.bookMap) return;

        // Helper to find map entry by canonical name
        const findMapEntry = (name) => {
            // The JSON keys are IDs "1", "2"... 
            // We search values for matching canonical name
            for (const [id, data] of Object.entries(state.bookMap)) {
                if (data.canonical === name) return { id, ...data };
            }
            return null;
        };

        oldTestament = oldTestamentBase.map(book => {
            const mapData = findMapEntry(book.name);
            return { ...book, ...mapData }; // Merge chapters with ID/Aliases/Foreign names
        });

        newTestament = newTestamentBase.map(book => {
            const mapData = findMapEntry(book.name);
            return { ...book, ...mapData };
        });
    }

    // UI HELPER FUNCTIONS ==========================================
    function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

    // API FUNCTIONS ================================================
    
    // Fetch Verses (Standard)
    async function fetchVerses(bookId, chapter, version) {
        // Use ID for cache key
        const cacheKey = `${bookId}-${chapter}-${version}`;
        if (state.versesCache[cacheKey]) return state.versesCache[cacheKey];

        try {
            // Pass the ID (e.g. "1") as the book parameter
            const url = `/.netlify/functions/bible-proxy?book=${bookId}&chapter=${chapter}&version=${version}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            
            const data = await response.json();
            state.versesCache[cacheKey] = data;
            return data;
        } catch (error) {
            console.error('API Error:', error);
            return null;
        }
    }

    // Fetch Original Language
    async function fetchOriginalLanguage(bookId, chapter, testament) {
        const cacheKey = `${bookId}-${chapter}-original`;
        if (state.versesCache[cacheKey]) return state.versesCache[cacheKey];

        try {
            // Pass ID, type=original, and testament (for OT/NT logic in backend)
            // Testament string needs to be simplified for the backend 'ot'/'nt' check if needed, 
            // though our new proxy handles "Old Testament" string fine.
            const tCode = testament === 'Old Testament' ? 'ot' : 'nt';
            const url = `/.netlify/functions/bible-proxy?book=${bookId}&chapter=${chapter}&type=original&testament=${tCode}`;
            
            const response = await fetch(url);
            if (!response.ok) return null;

            const data = await response.json();
            if (!data || !data.verses || data.verses.length === 0) return null;
            
            // Extract just the array from the wrapper we created in proxy
            const versesArray = data.verses; 
            state.versesCache[cacheKey] = versesArray;
            return versesArray;
        } catch (error) {
            console.error('Original language API Error:', error);
            return null;
        }
    }

    // CORE RENDER LOGIC ============================================

    // Modified Update Breadcrumb to show Japanese name if applicable
    function updateBreadcrumb() {
        const breadcrumb = document.getElementById('breadcrumb');
        let html = '';
        
        if (state.selectedTestament) {
            html += `<span class="text-amber-400">${state.selectedTestament}</span>`;
            if (state.selectedBook) {
                html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                
                // Determine original name
                const originalName = state.selectedTestament === 'Old Testament' 
                    ? state.selectedBook.wlc 
                    : state.selectedBook.tr;

                // Format: "Genesis (בראשית)"
                const displayName = originalName 
                    ? `${state.selectedBook.canonical} <span class="text-slate-400 font-serif">(${originalName})</span>`
                    : state.selectedBook.canonical;
                
                html += `<span class="text-amber-400">${displayName}</span>`;
                
                if (state.selectedChapter) {
                    html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                    html += `<span class="text-amber-400">Chapter ${state.selectedChapter}</span>`;
                }
            }
        }
        breadcrumb.innerHTML = html;
    }

    // Render Verses Function
    async function renderVerses() {
        const contentArea = document.getElementById('content-area');
        updateBreadcrumb(); // Update breadcrumb in case translation changed (for JP name)
        showLoading();

        // 1. Fetch Main Translation
        // Note: passing state.selectedBook.id (the number from JSON map)
        const data = await fetchVerses(state.selectedBook.id, state.selectedChapter, state.selectedTranslation);
        
        // 2. Fetch Original Language
        const originalData = await fetchOriginalLanguage(state.selectedBook.id, state.selectedChapter, state.selectedTestament);
        
        hideLoading();

        if (!data || !data.verses || data.verses.length === 0) {
            contentArea.innerHTML = `<div class="bg-slate-700/30 border border-slate-600/50 rounded-lg p-8 text-center text-slate-400"><p>Unable to load verses.</p></div>`;
            return;
        }

        // Reset current verses for notes
        state.currentVerses = {};
        data.verses.forEach(v => { state.currentVerses[v.verse] = v.text; });

        contentArea.innerHTML = `
            <div class="bg-slate-900/50 border border-slate-800/50 rounded-lg p-8 text-slate-200 leading-relaxed text-lg shadow-xl">
                ${data.verses.map(verse => {
                    const bookName = state.selectedBook.canonical;
                    const chapterNum = state.selectedChapter;
                    const verseKey = `${bookName}-${chapterNum}-${verse.verse}`;
                    const hasNotes = state.notes[verseKey];
                    const highlight = state.highlights[verseKey];
                    const highlightStyle = highlight ? `background-color: ${highlightColors[highlight]}; padding: 2px 4px; border-radius: 3px;` : '';
                    
                    // Original Text Logic
                    let originalText = '';
                    if (originalData && originalData[verse.verse - 1]) {
                        // Support both raw object (Bolls direct) or normalized wrapper
                        const verseData = originalData[verse.verse - 1];
                        originalText = verseData.text || verseData.verse || '';
                    }
                    
                    // Clean up HTML tags if present (Bolls sometimes sends HTML)
                    const cleanText = verse.text.replace(/<[^>]*>/g, '');

                    return `
                        <div class="verse-wrapper">
                            <sup class="verse-number">${verse.verse}</sup>
                            <span class="verse-content ${highlight ? 'verse-highlighted' : ''}" style="${highlightStyle}" data-verse="${verse.verse}">${cleanText}</span>
                            <span class="verse-actions">
                                <button onclick="openHighlightModal(${verse.verse})" class="inline-flex items-center justify-center w-5 h-5 rounded hover:bg-slate-700/50 ${highlight ? 'text-amber-400' : 'text-slate-500 hover:text-amber-400'}">
                                    <svg class="w-3.5 h-3.5" fill="${highlight ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                    </svg>
                                </button>
                                <button onclick="openNotesModal(${verse.verse})" class="inline-flex items-center justify-center w-5 h-5 rounded hover:bg-slate-700/50 ${hasNotes ? 'text-amber-400' : 'text-slate-500 hover:text-amber-400'}">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                    </svg>
                                </button>
                            </span>
                            ${originalText ? `
                                <div class="mt-2 ml-6 text-base text-slate-400 italic border-l-2 border-slate-700 pl-3">
                                    <span class="text-xs text-amber-400 font-semibold">${state.selectedTestament === 'Old Testament' ? 'Hebrew' : 'Greek'}:</span>
                                    <span class="font-serif" dir="${state.selectedTestament === 'Old Testament' ? 'rtl' : 'ltr'}">${originalText}</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    // NAVIGATION & UTILS ===========================================
    // (Keep your existing navigation functions: selectTestament, selectBook, selectChapter...)
    // (Keep your existing Note/Highlight modal functions...)
    
    // NOTE: Ensure selectBook uses the object passed to it
    function selectBook(book) {
        state.selectedBook = book;
        document.getElementById('book-selection').classList.add('hidden');
        document.getElementById('chapter-selection').classList.remove('hidden');
        updateBreadcrumb();
        renderChapters();
    }
    
    // Existing functions need to be preserved below this point...
    // (Paste the rest of your original functions here: renderBooks, renderChapters, 
    // selectChapter, changeTranslation, openNotesModal, etc. unchanged)

    // RE-Paste: renderBooks needs to use the dynamic state arrays
    function renderBooks() {
        const grid = document.getElementById('books-grid');
        const books = state.selectedTestament === 'Old Testament' ? oldTestament : newTestament;
        
        grid.innerHTML = books.map(book => {
            // Determine original language name based on Testament
            // wlc = Hebrew (Westminster Leningrad Codex)
            // tr = Greek (Textus Receptus)
            const originalName = state.selectedTestament === 'Old Testament' 
                ? book.wlc 
                : book.tr;

            return `
            <button onclick='selectBook(${JSON.stringify(book).replace(/'/g, "&#39;")})' class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-4 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50">
                <div class="font-semibold">${book.canonical}</div>
                <div class="text-xs text-amber-500/80 mt-1 font-serif">${originalName || ''}</div> 
                <div class="text-sm text-slate-400 mt-2">${book.chapters} chapters</div>
            </button>
            `;
        }).join('');
    }

    // Standard re-implementations of existing small functions
    function selectTestament(testament) {
        state.selectedTestament = testament;
        document.getElementById('testament-selection').classList.add('hidden');
        document.getElementById('book-selection').classList.remove('hidden');
        updateBreadcrumb();
        renderBooks();
    }
    function goBackToTestament() {
        state.selectedTestament = null;
        state.selectedBook = null;
        document.getElementById('book-selection').classList.add('hidden');
        document.getElementById('testament-selection').classList.remove('hidden');
        updateBreadcrumb();
    }
    function renderChapters() {
        const grid = document.getElementById('chapters-grid');
        const chapters = Array.from({ length: state.selectedBook.chapters }, (_, i) => i + 1);
        grid.innerHTML = chapters.map(chapter => `
            <button onclick="selectChapter(${chapter})" class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-3 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50 font-semibold">
                ${chapter}
            </button>
        `).join('');
    }
    function selectChapter(chapter) {
        state.selectedChapter = chapter;
        state.selectedVerse = null;
        document.getElementById('chapter-selection').classList.add('hidden');
        document.getElementById('chapter-view').classList.remove('hidden');
        updateBreadcrumb();
        document.getElementById('translation-select').value = state.selectedTranslation;
        renderVerses();
    }
    function goBackToBooks() {
        state.selectedBook = null;
        state.selectedChapter = null;
        document.getElementById('chapter-selection').classList.add('hidden');
        document.getElementById('book-selection').classList.remove('hidden');
        updateBreadcrumb();
    }
    function goBackToChapters() {
        state.selectedChapter = null;
        state.selectedVerse = null;
        document.getElementById('chapter-view').classList.add('hidden');
        document.getElementById('chapter-selection').classList.remove('hidden');
        updateBreadcrumb();
    }
    function changeTranslation() {
        const select = document.getElementById('translation-select');
        state.selectedTranslation = select.value;
        renderVerses();
    }
    
    // ... Keep all Note/Highlight functions (loadNotes, saveNotesToStorage, openNotesModal, etc.) exactly as they were ...
    
    function loadNotes() {
        const saved = localStorage.getItem('bible-notes');
        if (saved) state.notes = JSON.parse(saved);
    }
    function saveNotesToStorage() {
        localStorage.setItem('bible-notes', JSON.stringify(state.notes));
    }
    function loadHighlights() {
        const saved = localStorage.getItem('bible-highlights');
        if (saved) state.highlights = JSON.parse(saved);
    }
    function saveHighlights() {
        localStorage.setItem('bible-highlights', JSON.stringify(state.highlights));
    }
    
    // ... Paste the rest of your UI helper functions (openNotesModal, closeNotesModal, saveNote, openHighlightModal, selectHighlight, etc.) ...
    // These do not need logic changes, just ensure they are present in the final file.
    
    function openNotesModal(verseNum) {
        state.selectedVerse = verseNum;
        const bookName = state.selectedBook.canonical; // Changed from .name to .canonical
        const chapterNum = state.selectedChapter;
        const verseKey = `${bookName}-${chapterNum}-${verseNum}`;
        document.getElementById('notes-verse-title').textContent = `Notes - ${bookName} ${chapterNum}:${verseNum}`;
        document.getElementById('notes-verse-text').textContent = state.currentVerses[verseNum] || '';
        document.getElementById('note-textarea').value = state.notes[verseKey] || '';
        document.getElementById('notes-modal').classList.remove('hidden');
    }
    
    function closeNotesModal() {
        document.getElementById('notes-modal').classList.add('hidden');
        state.selectedVerse = null;
    }

    function saveNote() {
        const textarea = document.getElementById('note-textarea');
        const bookName = state.selectedBook.canonical; // Changed from .name to .canonical
        const chapterNum = state.selectedChapter;
        const verseKey = `${bookName}-${chapterNum}-${state.selectedVerse}`;
        state.notes[verseKey] = textarea.value;
        saveNotesToStorage();
        closeNotesModal();
        renderVerses();
    }

    // Modal Closing Logic
    document.getElementById('notes-modal').addEventListener('click', function(e) { if (e.target === this) closeNotesModal(); });
    document.getElementById('highlight-modal').addEventListener('click', function(e) { if (e.target === this) closeHighlightModal(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeNotesModal(); closeHighlightModal();
            if (!document.getElementById('highlights-panel').classList.contains('hidden')) toggleHighlightsPanel();
        }
    });

    function openHighlightModal(verseNum) { state.highlightingVerse = verseNum; document.getElementById('highlight-modal').classList.remove('hidden'); }
    function closeHighlightModal() { document.getElementById('highlight-modal').classList.add('hidden'); state.highlightingVerse = null; }

    function selectHighlight(color) {
        if (!state.highlightingVerse) return;
        const bookName = state.selectedBook.canonical; // Changed from .name to .canonical
        const chapterNum = state.selectedChapter;
        const verseKey = `${bookName}-${chapterNum}-${state.highlightingVerse}`;
        if (state.highlights[verseKey] === color) { delete state.highlights[verseKey]; } 
        else { state.highlights[verseKey] = color; }
        saveHighlights();
        updateHighlightsCount();
        closeHighlightModal();
        renderVerses();
    }

    function updateHighlightsCount() {
        document.getElementById('highlights-count').textContent = Object.keys(state.highlights).length;
    }

    function toggleHighlightsPanel() {
        const panel = document.getElementById('highlights-panel');
        if (panel.classList.contains('hidden')) { panel.classList.remove('hidden'); renderHighlightsPanel(); } 
        else { panel.classList.add('hidden'); }
    }

    function renderHighlightsPanel() {
        const content = document.getElementById('highlights-content');
        const highlights = Object.entries(state.highlights);
        if (highlights.length === 0) { content.innerHTML = '<div class="text-slate-400 text-center py-8">No highlighted verses yet</div>'; return; }
        
        const grouped = {};
        highlights.forEach(([key, color]) => {
            const parts = key.split('-');
            // Handle book names that might contain hyphens? Current key format is "Name-Chapter-Verse"
            // Better to reconstruct carefully
            const verse = parts.pop();
            const chapter = parts.pop();
            const book = parts.join('-'); // Rejoin remainder in case book name had hyphen
            
            const bookChapter = `${book} ${chapter}`;
            if (!grouped[bookChapter]) grouped[bookChapter] = [];
            grouped[bookChapter].push({ verse, color, key });
        });

        content.innerHTML = Object.entries(grouped).map(([bookChapter, verses]) => `
            <div class="mb-4">
                <h4 class="font-bold text-slate-300 mb-2">${bookChapter}</h4>
                <div class="space-y-2">
                    ${verses.map(v => `
                        <div class="flex items-center gap-2 group">
                            <div class="w-3 h-3 rounded flex-shrink-0" style="background-color: ${highlightColors[v.color]}"></div>
                            <button onclick="goToVerse('${v.key}')" class="flex-1 text-left text-sm text-slate-300 hover:text-white transition-colors">
                                Verse ${v.verse}
                            </button>
                            <button onclick="removeHighlight('${v.key}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition-all">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function removeHighlight(verseKey) {
        delete state.highlights[verseKey];
        saveHighlights();
        updateHighlightsCount();
        renderHighlightsPanel();
        if (state.selectedBook && state.selectedChapter) renderVerses();
    }

    function goToVerse(verseKey) {
        const parts = verseKey.split('-');
        const verse = parts.pop();
        const chapter = parseInt(parts.pop());
        const bookName = parts.join('-');
        
        // Find Book Object
        const allBooks = [...oldTestament, ...newTestament];
        const book = allBooks.find(b => b.canonical === bookName); // Search by canonical name
        
        if (!book) return;

        state.selectedTestament = oldTestament.includes(book) ? 'Old Testament' : 'New Testament';
        state.selectedBook = book;
        state.selectedChapter = chapter;
        
        document.getElementById('testament-selection').classList.add('hidden');
        document.getElementById('book-selection').classList.add('hidden');
        document.getElementById('chapter-selection').classList.add('hidden');
        document.getElementById('chapter-view').classList.remove('hidden');
        
        updateBreadcrumb();
        document.getElementById('translation-select').value = state.selectedTranslation;
        toggleHighlightsPanel();
        
        renderVerses().then(() => {
            setTimeout(() => {
                const verseElement = document.querySelector(`[data-verse="${verse}"]`);
                if (verseElement) {
                    verseElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    verseElement.style.transition = 'all 0.3s';
                    verseElement.style.transform = 'scale(1.05)';
                    setTimeout(() => { verseElement.style.transform = 'scale(1)'; }, 300);
                }
            }, 100);
        });
    }

    eruda.init();
</script>
</body>
</html>
