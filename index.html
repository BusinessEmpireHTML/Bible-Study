<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <div class="bg-slate-800/50 backdrop-blur-sm border-b border-slate-700/50 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <h1 class="text-2xl font-bold">Bible Study</h1>
            </div>
            <div id="breadcrumb" class="flex items-center gap-2 mt-3 text-sm text-slate-300"></div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-slate-800 rounded-lg p-6 flex items-center gap-3">
            <svg class="animate-spin h-6 w-6 text-amber-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Loading Bible content...</span>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notes-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                    <span id="notes-verse-title">Notes</span>
                </h3>
                <button onclick="closeNotesModal()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="notes-verse-text" class="bg-slate-900/50 rounded-lg p-4 mb-4 text-slate-300 border border-slate-700/50"></div>
            
            <textarea 
                id="note-textarea" 
                class="w-full h-64 bg-slate-900/50 text-slate-200 border border-slate-600/50 rounded-lg p-3 resize-none focus:outline-none focus:border-amber-500 transition-colors mb-4" 
                placeholder="Write your notes here..."
            ></textarea>
            
            <div class="flex gap-3">
                <button onclick="saveNote()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-medium transition-colors">
                    Save Note
                </button>
                <button onclick="closeNotesModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Testament Selection -->
        <div id="testament-selection" class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto mt-12">
            <button onclick="selectTestament('Old Testament')" class="bg-gradient-to-br from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">Old Testament</h2>
                <p class="text-amber-100">Hebrew Scriptures</p>
            </button>
            <button onclick="selectTestament('New Testament')" class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">New Testament</h2>
                <p class="text-blue-100">Greek Scriptures</p>
            </button>
        </div>

        <!-- Book Selection -->
        <div id="book-selection" class="hidden">
            <button onclick="goBackToTestament()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Testament Selection
            </button>
            <div id="books-grid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </div>

        <!-- Chapter Selection -->
        <div id="chapter-selection" class="hidden">
            <button onclick="goBackToBooks()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Book Selection
            </button>
            <div id="chapters-grid" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2"></div>
        </div>

        <!-- Chapter View -->
        <div id="chapter-view" class="hidden">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <button onclick="goBackToChapters()" class="text-amber-400 hover:text-amber-300 flex items-center gap-2">
                    ← Back to Chapter Selection
                </button>
                
                <div class="flex flex-wrap gap-2 items-center">
                    <label class="text-slate-300 text-sm">Translation:</label>
                    <select id="translation-select" onchange="changeTranslation()" class="bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-500">
                        <option value="KJV">KJV - King James Version</option>
                        <option value="WEB">WEB - World English Bible</option>
                        <option value="BBE">BBE - Bible in Basic English</option>
                    </select>
                </div>
            </div>

            <div id="content-area" class="max-w-4xl mx-auto"></div>
        </div>
    </div>

    <script>
        // Using Bible-API.com - completely free, no API key needed
        const translations = ['KJV', 'WEB', 'BBE'];

        // State management
        let state = {
            selectedTestament: null,
            selectedBook: null,
            selectedChapter: null,
            selectedVerse: null,
            selectedVerseText: '',
            notes: {},
            currentNote: '',
            selectedTranslation: 'KJV',
            versesCache: {},
            currentVerses: {}
        };

        // Bible books with their abbreviations
        const oldTestament = [
            { name: 'Genesis', id: 'Genesis', chapters: 50 },
            { name: 'Exodus', id: 'Exodus', chapters: 40 },
            { name: 'Leviticus', id: 'Leviticus', chapters: 27 },
            { name: 'Numbers', id: 'Numbers', chapters: 36 },
            { name: 'Deuteronomy', id: 'Deuteronomy', chapters: 34 },
            { name: 'Joshua', id: 'Joshua', chapters: 24 },
            { name: 'Judges', id: 'Judges', chapters: 21 },
            { name: 'Ruth', id: 'Ruth', chapters: 4 },
            { name: '1 Samuel', id: '1Samuel', chapters: 31 },
            { name: '2 Samuel', id: '2Samuel', chapters: 24 },
            { name: '1 Kings', id: '1Kings', chapters: 22 },
            { name: '2 Kings', id: '2Kings', chapters: 25 },
            { name: '1 Chronicles', id: '1Chronicles', chapters: 29 },
            { name: '2 Chronicles', id: '2Chronicles', chapters: 36 },
            { name: 'Ezra', id: 'Ezra', chapters: 10 },
            { name: 'Nehemiah', id: 'Nehemiah', chapters: 13 },
            { name: 'Esther', id: 'Esther', chapters: 10 },
            { name: 'Job', id: 'Job', chapters: 42 },
            { name: 'Psalms', id: 'Psalms', chapters: 150 },
            { name: 'Proverbs', id: 'Proverbs', chapters: 31 },
            { name: 'Ecclesiastes', id: 'Ecclesiastes', chapters: 12 },
            { name: 'Song of Solomon', id: 'SongofSolomon', chapters: 8 },
            { name: 'Isaiah', id: 'Isaiah', chapters: 66 },
            { name: 'Jeremiah', id: 'Jeremiah', chapters: 52 },
            { name: 'Lamentations', id: 'Lamentations', chapters: 5 },
            { name: 'Ezekiel', id: 'Ezekiel', chapters: 48 },
            { name: 'Daniel', id: 'Daniel', chapters: 12 },
            { name: 'Hosea', id: 'Hosea', chapters: 14 },
            { name: 'Joel', id: 'Joel', chapters: 3 },
            { name: 'Amos', id: 'Amos', chapters: 9 },
            { name: 'Obadiah', id: 'Obadiah', chapters: 1 },
            { name: 'Jonah', id: 'Jonah', chapters: 4 },
            { name: 'Micah', id: 'Micah', chapters: 7 },
            { name: 'Nahum', id: 'Nahum', chapters: 3 },
            { name: 'Habakkuk', id: 'Habakkuk', chapters: 3 },
            { name: 'Zephaniah', id: 'Zephaniah', chapters: 3 },
            { name: 'Haggai', id: 'Haggai', chapters: 2 },
            { name: 'Zechariah', id: 'Zechariah', chapters: 14 },
            { name: 'Malachi', id: 'Malachi', chapters: 4 }
        ];

        const newTestament = [
            { name: 'Matthew', id: 'Matthew', chapters: 28 },
            { name: 'Mark', id: 'Mark', chapters: 16 },
            { name: 'Luke', id: 'Luke', chapters: 24 },
            { name: 'John', id: 'John', chapters: 21 },
            { name: 'Acts', id: 'Acts', chapters: 28 },
            { name: 'Romans', id: 'Romans', chapters: 16 },
            { name: '1 Corinthians', id: '1Corinthians', chapters: 16 },
            { name: '2 Corinthians', id: '2Corinthians', chapters: 13 },
            { name: 'Galatians', id: 'Galatians', chapters: 6 },
            { name: 'Ephesians', id: 'Ephesians', chapters: 6 },
            { name: 'Philippians', id: 'Philippians', chapters: 4 },
            { name: 'Colossians', id: 'Colossians', chapters: 4 },
            { name: '1 Thessalonians', id: '1Thessalonians', chapters: 5 },
            { name: '2 Thessalonians', id: '2Thessalonians', chapters: 3 },
            { name: '1 Timothy', id: '1Timothy', chapters: 6 },
            { name: '2 Timothy', id: '2Timothy', chapters: 4 },
            { name: 'Titus', id: 'Titus', chapters: 3 },
            { name: 'Philemon', id: 'Philemon', chapters: 1 },
            { name: 'Hebrews', id: 'Hebrews', chapters: 13 },
            { name: 'James', id: 'James', chapters: 5 },
            { name: '1 Peter', id: '1Peter', chapters: 5 },
            { name: '2 Peter', id: '2Peter', chapters: 3 },
            { name: '1 John', id: '1John', chapters: 5 },
            { name: '2 John', id: '2John', chapters: 1 },
            { name: '3 John', id: '3John', chapters: 1 },
            { name: 'Jude', id: 'Jude', chapters: 1 },
            { name: 'Revelation', id: 'Revelation', chapters: 22 }
        ];

        window.onload = function() {
            loadNotes();
        };

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        // API Functions
        async function fetchVerses(book, chapter, version) {
            const cacheKey = `${book}-${chapter}-${version}`;
            if (state.versesCache[cacheKey]) {
                return state.versesCache[cacheKey];
            }

            try {
                const url = `/.netlify/functions/bible-proxy?book=${encodeURIComponent(book)}&chapter=${chapter}&version=${version}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                state.versesCache[cacheKey] = data;
                return data;
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        // Load notes from localStorage
        function loadNotes() {
            const saved = localStorage.getItem('bible-notes');
            if (saved) {
                state.notes = JSON.parse(saved);
            }
        }

        // Save notes to localStorage
        function saveNotesToStorage() {
            localStorage.setItem('bible-notes', JSON.stringify(state.notes));
        }

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '';
            
            if (state.selectedTestament) {
                html += `<span class="text-amber-400">${state.selectedTestament}</span>`;
                
                if (state.selectedBook) {
                    html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                    html += `<span class="text-amber-400">${state.selectedBook.name}</span>`;
                    
                    if (state.selectedChapter) {
                        html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                        html += `<span class="text-amber-400">Chapter ${state.selectedChapter}</span>`;
                    }
                }
            }
            
            breadcrumb.innerHTML = html;
        }

        // Testament selection
        function selectTestament(testament) {
            state.selectedTestament = testament;
            document.getElementById('testament-selection').classList.add('hidden');
            document.getElementById('book-selection').classList.remove('hidden');
            updateBreadcrumb();
            renderBooks();
        }

        function goBackToTestament() {
            state.selectedTestament = null;
            state.selectedBook = null;
            document.getElementById('book-selection').classList.add('hidden');
            document.getElementById('testament-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Book selection
        function renderBooks() {
            const grid = document.getElementById('books-grid');
            const books = state.selectedTestament === 'Old Testament' ? oldTestament : newTestament;
            
            grid.innerHTML = books.map(book => `
                <button onclick='selectBook(${JSON.stringify(book).replace(/'/g, "&#39;")})' class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-4 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50">
                    <div class="font-semibold">${book.name}</div>
                    <div class="text-sm text-slate-400">${book.chapters} chapters</div>
                </button>
            `).join('');
        }

        function selectBook(book) {
            state.selectedBook = book;
            document.getElementById('book-selection').classList.add('hidden');
            document.getElementById('chapter-selection').classList.remove('hidden');
            updateBreadcrumb();
            renderChapters();
        }

        function goBackToBooks() {
            state.selectedBook = null;
            state.selectedChapter = null;
            document.getElementById('chapter-selection').classList.add('hidden');
            document.getElementById('book-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Chapter selection
        function renderChapters() {
            const grid = document.getElementById('chapters-grid');
            const chapters = Array.from({ length: state.selectedBook.chapters }, (_, i) => i + 1);
            
            grid.innerHTML = chapters.map(chapter => `
                <button onclick="selectChapter(${chapter})" class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-3 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50 font-semibold">
                    ${chapter}
                </button>
            `).join('');
        }

        function selectChapter(chapter) {
            state.selectedChapter = chapter;
            state.selectedVerse = null;
            document.getElementById('chapter-selection').classList.add('hidden');
            document.getElementById('chapter-view').classList.remove('hidden');
            updateBreadcrumb();
            
            // Set translation selector to current selection
            document.getElementById('translation-select').value = state.selectedTranslation;
            
            renderVerses();
        }

        function goBackToChapters() {
            state.selectedChapter = null;
            state.selectedVerse = null;
            document.getElementById('chapter-view').classList.add('hidden');
            document.getElementById('chapter-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Translation change
        function changeTranslation() {
            const select = document.getElementById('translation-select');
            state.selectedTranslation = select.value;
            renderVerses();
        }

        // Verses rendering
        async function renderVerses() {
            const contentArea = document.getElementById('content-area');
            showLoading();

            const data = await fetchVerses(state.selectedBook.id, state.selectedChapter, state.selectedTranslation);

            hideLoading();

            if (!data || !data.verses || data.verses.length === 0) {
                contentArea.innerHTML = `
                    <div class="bg-slate-700/30 border border-slate-600/50 rounded-lg p-8 text-center text-slate-400">
                        <p>Unable to load verses. Please try again.</p>
                    </div>
                `;
                return;
            }

            // Store current verses for notes modal
            state.currentVerses = {};
            data.verses.forEach(v => {
                state.currentVerses[v.verse] = v.text;
            });

            contentArea.innerHTML = `
                <div class="space-y-3">
                    ${data.verses.map(verse => {
                        const bookName = state.selectedBook.name;
                        const chapterNum = state.selectedChapter;
                        const verseKey = `${bookName}-${chapterNum}-${verse.verse}`;
                        const hasNotes = state.notes[verseKey];
                        
                        return `
                            <div class="bg-slate-800/50 border border-slate-700/50 hover:border-slate-600 rounded-lg p-4 transition-all group">
                                <div class="flex items-start gap-3">
                                    <span class="text-amber-400 font-bold text-lg flex-shrink-0 mt-0.5 min-w-[2rem]">${verse.verse}</span>
                                    <div class="flex-1">
                                        <p class="text-slate-200 leading-relaxed">${verse.text}</p>
                                    </div>
                                    <button 
                                        onclick="openNotesModal(${verse.verse})" 
                                        class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity p-2 rounded-lg ${hasNotes ? 'text-amber-400 bg-amber-500/10' : 'text-slate-400 hover:text-amber-400 hover:bg-slate-700/50'}"
                                        title="${hasNotes ? 'Edit notes' : 'Add notes'}"
                                    >
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                        </svg>
                                    </button>
                                </div>
                                ${hasNotes ? `
                                    <div class="mt-2 ml-11 flex items-center gap-2 text-amber-400 text-xs">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
                                        </svg>
                                        <span>Has notes</span>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Notes modal functions
        function openNotesModal(verseNum) {
            state.selectedVerse = verseNum;
            const bookName = state.selectedBook.name;
            const chapterNum = state.selectedChapter;
            const verseKey = `${bookName}-${chapterNum}-${verseNum}`;
            
            // Set modal content
            document.getElementById('notes-verse-title').textContent = `Notes - ${bookName} ${chapterNum}:${verseNum}`;
            document.getElementById('notes-verse-text').textContent = state.currentVerses[verseNum] || '';
            document.getElementById('note-textarea').value = state.notes[verseKey] || '';
            
            // Show modal
            document.getElementById('notes-modal').classList.remove('hidden');
        }

        function closeNotesModal() {
            document.getElementById('notes-modal').classList.add('hidden');
            state.selectedVerse = null;
        }

        function saveNote() {
            const textarea = document.getElementById('note-textarea');
            const bookName = state.selectedBook.name;
            const chapterNum = state.selectedChapter;
            const verseKey = `${bookName}-${chapterNum}-${state.selectedVerse}`;
            
            state.notes[verseKey] = textarea.value;
            saveNotesToStorage();
            
            closeNotesModal();
            renderVerses(); // Refresh to show "Has notes" indicator
        }

        // Close modal when clicking outside
        document.getElementById('notes-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeNotesModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeNotesModal();
            }
        });
    </script>
</body>
</html>
