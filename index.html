<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #020617, #0f172a, #020617);
            min-height: 100vh;
        }
        
        .verse-wrapper {
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .verse-text {
            display: inline;
        }
        
        .verse-number {
            font-weight: 600;
            color: #fbbf24;
            font-size: 0.75rem;
            vertical-align: super;
            margin-right: 0.25rem;
            cursor: pointer;
            user-select: none;
        }
        
        .verse-content {
            display: inline;
            cursor: pointer;
            padding: 2px 0;
            transition: all 0.2s;
        }
        
        .verse-content:hover {
            background-color: rgba(251, 191, 36, 0.1);
            border-radius: 3px;
        }
        
        .verse-highlighted {
            background-color: rgba(251, 191, 36, 0.25);
            border-radius: 3px;
            padding: 2px 4px;
        }
        
        .verse-actions {
            display: inline-flex;
            gap: 0.25rem;
            margin-left: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .verse-wrapper:hover .verse-actions {
            opacity: 1;
        }
        
        .highlight-color {
            width: 1rem;
            height: 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .highlight-color:hover {
            transform: scale(1.2);
            border-color: white;
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <div class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800/50 sticky top-0 z-10 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>

                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                    </svg>
                    <span>Highlights</span>
                    <span id="highlights-count" class="bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
            <div id="breadcrumb" class="flex items-center gap-2 mt-3 text-sm text-slate-300"></div>
        </div>
    </div>

    <!-- Highlights Panel -->
    <div id="highlights-panel" class="hidden fixed top-20 right-4 w-96 max-h-[80vh] bg-slate-900/95 backdrop-blur-sm border border-slate-700/50 rounded-lg shadow-2xl overflow-hidden z-50">

            <h3 class="font-bold text-white flex items-center gap-2">

                </svg>
                Highlighted Verses

            <button onclick="toggleHighlightsPanel()" class="text-slate-400 hover:text-white">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="highlights-content" class="overflow-y-auto max-h-[calc(80vh-5rem)] p-4">
            <div class="text-slate-400 text-center py-8">No highlighted verses yet</div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-slate-800 rounded-lg p-6 flex items-center gap-3">

            </svg>

        </div>
    </div>

    <!-- Highlight Color Picker Modal -->

                <button onclick="selectHighlight('green')" class="highlight-color" style="background-color: rgba(34, 197, 94, 0.4);" title="Green"></button>
                <button onclick="selectHighlight('blue')" class="highlight-color" style="background-color: rgba(59, 130, 246, 0.4);" title="Blue"></button>
                <button onclick="selectHighlight('purple')" class="highlight-color" style="background-color: rgba(168, 85, 247, 0.4);" title="Purple"></button>
                <button onclick="selectHighlight('pink')" class="highlight-color" style="background-color: rgba(236, 72, 153, 0.4);" title="Pink"></button>
                <button onclick="selectHighlight('red')" class="highlight-color" style="background-color: rgba(239, 68, 68, 0.4);" title="Red"></button>
                <button onclick="selectHighlight('orange')" class="highlight-color" style="background-color: rgba(249, 115, 22, 0.4);" title="Orange"></button>
                <button onclick="selectHighlight('teal')" class="highlight-color" style="background-color: rgba(20, 184, 166, 0.4);" title="Teal"></button>
                <button onclick="selectHighlight('cyan')" class="highlight-color" style="background-color: rgba(6, 182, 212, 0.4);" title="Cyan"></button>

            </div>

                Cancel
            </button>
        </div>
    </div>
    <div id="notes-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                    <span id="notes-verse-title">Notes</span>
                </h3>
                <button onclick="closeNotesModal()" class="text-slate-400 hover:text-white">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="notes-verse-text" class="bg-slate-900/50 rounded-lg p-4 mb-4 text-slate-300 border border-slate-700/50"></div>
            
            <textarea 
                id="note-textarea" 
                class="w-full h-64 bg-slate-900/50 text-slate-200 border border-slate-600/50 rounded-lg p-3 resize-none focus:outline-none focus:border-amber-500 transition-colors mb-4" 
                placeholder="Write your notes here..."
            ></textarea>
            
            <div class="flex gap-3">
                <button onclick="saveNote()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-medium transition-colors">
                    Save Note
                </button>
                <button onclick="closeNotesModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Testament Selection -->
        <div id="testament-selection" class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto mt-12">
            <button onclick="selectTestament('Old Testament')" class="bg-gradient-to-br from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">Old Testament</h2>
                <p class="text-amber-100">Hebrew Scriptures</p>
            </button>
            <button onclick="selectTestament('New Testament')" class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white p-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                <h2 class="text-2xl font-bold mb-2">New Testament</h2>
                <p class="text-blue-100">Greek Scriptures</p>
            </button>
        </div>

        <!-- Book Selection -->
        <div id="book-selection" class="hidden">
            <button onclick="goBackToTestament()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Testament Selection
            </button>
            <div id="books-grid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </div>

        <!-- Chapter Selection -->
        <div id="chapter-selection" class="hidden">
            <button onclick="goBackToBooks()" class="text-amber-400 hover:text-amber-300 mb-4 flex items-center gap-2">
                ← Back to Book Selection
            </button>
            <div id="chapters-grid" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2"></div>
        </div>

        <!-- Chapter View -->
        <div id="chapter-view" class="hidden">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <button onclick="goBackToChapters()" class="text-amber-400 hover:text-amber-300 flex items-center gap-2">
                    ← Back to Chapter Selection
                </button>
                
                <div class="flex flex-wrap gap-2 items-center">
                    <label class="text-slate-300 text-sm">Translation:</label>
                    <select id="translation-select" onchange="changeTranslation()" class="bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-amber-500">
                       <option value="KJV">KJV - King James Version</option>
                       <option value="WEB">WEB - World English Bible</option>
                       <option value="BBE">BBE - Bible in Basic English</option>
                       <option value="ASV">ASV - American Standard Version</option>
                       <option value="YLT">YLT - Young's Literal Translation</option>
                    </select>
                </div>
            </div>

            <div id="content-area" class="max-w-4xl mx-auto"></div>
        </div>
    </div>

        // Using Bible-API.com for English + Bolls Life for Hebrew/Greek
        const translations = ['KJV', 'WEB', 'BBE', 'ASV', 'YLT'];

               // Book abbreviations for Bolls Life API
        // Updated to use shorter codes (Mat, Mrk, Luk, Jhn) which work better with TR

            // Old Testament
            'Genesis': 'Gen', 'Exodus': 'Exo', 'Leviticus': 'Lev', 'Numbers': 'Num', 
            'Deuteronomy': 'Deu', 'Joshua': 'Jos', 'Judges': 'Jud', 'Ruth': 'Rut',

            '1 Chronicles': '1Ch', '2 Chronicles': '2Ch', 'Ezra': 'Ezr', 'Nehemiah': 'Neh',

            'Jeremiah': 'Jer', 'Lamentations': 'Lam', 'Ezekiel': 'Eze', 'Daniel': 'Dan',
            'Hosea': 'Hos', 'Joel': 'Joe', 'Amos': 'Amo', 'Obadiah': 'Oba',
            'Jonah': 'Jon', 'Micah': 'Mic', 'Nahum': 'Nah', 'Habakkuk': 'Hab',
            'Zephaniah': 'Zep', 'Haggai': 'Hag', 'Zechariah': 'Zec', 'Malachi': 'Mal',
            
            // New Testament - UPDATED KEYS HERE
            'Matthew': 'Mat',      // Changed from 'Matt'
            'Mark': 'ΜΑΡ',         // Changed from 'Mark' to be safe
            'Luke': 'Luk',         // Changed from 'Luke' to be safe
            'John': 'ΙΩΑ',         // Changed from 'John' to be safe
            'Acts': 'Act', 'Romans': 'Rom', '1 Corinthians': '1Co', '2 Corinthians': '2Co',
            'Galatians': 'Gal', 'Ephesians': 'Eph', 'Philippians': 'Phi', 'Colossians': 'Col',
            '1 Thessalonians': '1Th', '2 Thessalonians': '2Th', '1 Timothy': '1Ti',
            '2 Timothy': '2Ti', 'Titus': 'Tit', 'Philemon': 'Phi', 'Hebrews': 'Heb',
            'James': 'Jms', '1 Peter': '1Pe', '2 Peter': '2Pe', '1 John': '1Jh',
            '2 John': '2Jh', '3 John': '3Jh', 'Jude': 'Jud', 'Revelation': 'Rev'
        };


        // State management
        let state = {
            selectedTestament: null,
            selectedBook: null,
            selectedChapter: null,
            selectedVerse: null,
            selectedVerseText: '',
            notes: {},
            highlights: {},
            currentNote: '',
            selectedTranslation: 'KJV',
            versesCache: {},
            currentVerses: {},
            highlightingVerse: null
        };

        // Bible books with their abbreviations
        const oldTestament = [
            { name: 'Genesis', id: 'Genesis', chapters: 50 },
            { name: 'Exodus', id: 'Exodus', chapters: 40 },
            { name: 'Leviticus', id: 'Leviticus', chapters: 27 },
            { name: 'Numbers', id: 'Numbers', chapters: 36 },
            { name: 'Deuteronomy', id: 'Deuteronomy', chapters: 34 },
            { name: 'Joshua', id: 'Joshua', chapters: 24 },
            { name: 'Judges', id: 'Judges', chapters: 21 },
            { name: 'Ruth', id: 'Ruth', chapters: 4 },
            { name: '1 Samuel', id: '1Samuel', chapters: 31 },
            { name: '2 Samuel', id: '2Samuel', chapters: 24 },
            { name: '1 Kings', id: '1Kings', chapters: 22 },
            { name: '2 Kings', id: '2Kings', chapters: 25 },
            { name: '1 Chronicles', id: '1Chronicles', chapters: 29 },
            { name: '2 Chronicles', id: '2Chronicles', chapters: 36 },
            { name: 'Ezra', id: 'Ezra', chapters: 10 },
            { name: 'Nehemiah', id: 'Nehemiah', chapters: 13 },
            { name: 'Esther', id: 'Esther', chapters: 10 },
            { name: 'Job', id: 'Job', chapters: 42 },
            { name: 'Psalms', id: 'Psalms', chapters: 150 },
            { name: 'Proverbs', id: 'Proverbs', chapters: 31 },
            { name: 'Ecclesiastes', id: 'Ecclesiastes', chapters: 12 },
            { name: 'Song of Solomon', id: 'SongofSolomon', chapters: 8 },
            { name: 'Isaiah', id: 'Isaiah', chapters: 66 },
            { name: 'Jeremiah', id: 'Jeremiah', chapters: 52 },
            { name: 'Lamentations', id: 'Lamentations', chapters: 5 },
            { name: 'Ezekiel', id: 'Ezekiel', chapters: 48 },
            { name: 'Daniel', id: 'Daniel', chapters: 12 },
            { name: 'Hosea', id: 'Hosea', chapters: 14 },
            { name: 'Joel', id: 'Joel', chapters: 3 },
            { name: 'Amos', id: 'Amos', chapters: 9 },
            { name: 'Obadiah', id: 'Obadiah', chapters: 1 },
            { name: 'Jonah', id: 'Jonah', chapters: 4 },
            { name: 'Micah', id: 'Micah', chapters: 7 },
            { name: 'Nahum', id: 'Nahum', chapters: 3 },
            { name: 'Habakkuk', id: 'Habakkuk', chapters: 3 },
            { name: 'Zephaniah', id: 'Zephaniah', chapters: 3 },
            { name: 'Haggai', id: 'Haggai', chapters: 2 },
            { name: 'Zechariah', id: 'Zechariah', chapters: 14 },
            { name: 'Malachi', id: 'Malachi', chapters: 4 }
        ];

        const newTestament = [
            { name: 'Matthew', id: 'Matthew', chapters: 28 },
            { name: 'Mark', id: 'Mark', chapters: 16 },
            { name: 'Luke', id: 'Luke', chapters: 24 },
            { name: 'John', id: 'John', chapters: 21 },
            { name: 'Acts', id: 'Acts', chapters: 28 },
            { name: 'Romans', id: 'Romans', chapters: 16 },
            { name: '1 Corinthians', id: '1Corinthians', chapters: 16 },
            { name: '2 Corinthians', id: '2Corinthians', chapters: 13 },
            { name: 'Galatians', id: 'Galatians', chapters: 6 },
            { name: 'Ephesians', id: 'Ephesians', chapters: 6 },
            { name: 'Philippians', id: 'Philippians', chapters: 4 },
            { name: 'Colossians', id: 'Colossians', chapters: 4 },
            { name: '1 Thessalonians', id: '1Thessalonians', chapters: 5 },
            { name: '2 Thessalonians', id: '2Thessalonians', chapters: 3 },
            { name: '1 Timothy', id: '1Timothy', chapters: 6 },
            { name: '2 Timothy', id: '2Timothy', chapters: 4 },
            { name: 'Titus', id: 'Titus', chapters: 3 },
            { name: 'Philemon', id: 'Philemon', chapters: 1 },
            { name: 'Hebrews', id: 'Hebrews', chapters: 13 },
            { name: 'James', id: 'James', chapters: 5 },
            { name: '1 Peter', id: '1Peter', chapters: 5 },
            { name: '2 Peter', id: '2Peter', chapters: 3 },
            { name: '1 John', id: '1John', chapters: 5 },
            { name: '2 John', id: '2John', chapters: 1 },
            { name: '3 John', id: '3John', chapters: 1 },
            { name: 'Jude', id: 'Jude', chapters: 1 },
            { name: 'Revelation', id: 'Revelation', chapters: 22 }
        ];

        window.onload = function() {
            loadNotes();
            loadHighlights();
            updateHighlightsCount();
        };

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        // API Functions
        async function fetchVerses(book, chapter, version) {
            const cacheKey = `${book}-${chapter}-${version}`;
            if (state.versesCache[cacheKey]) {
                return state.versesCache[cacheKey];
            }

            try {
                const url = `/.netlify/functions/bible-proxy?book=${encodeURIComponent(book)}&chapter=${chapter}&version=${version}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                state.versesCache[cacheKey] = data;
                return data;
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        async function fetchOriginalLanguage(book, chapter, testament) {
            const cacheKey = `${book}-${chapter}-original`;
            if (state.versesCache[cacheKey]) {
                return state.versesCache[cacheKey];
            }

            try {
                const bollsBook = bollsBookMap[book];
                if (!bollsBook) {
                    console.log('Book not found in map:', book);
                    return null;
                }
                
                const testamentCode = testament === 'Old Testament' ? 'ot' : 'nt';
                const url = `/.netlify/functions/bible-proxy?book=${bollsBook}&chapter=${chapter}&type=original&testament=${testamentCode}`;
                
                console.log('Fetching original language from:', url);
                
                const response = await fetch(url);

                if (!response.ok) {
                    console.error('Original language fetch failed:', response.status);
                    return null;
                }

                const data = await response.json();
                
                // Handle empty response gracefully
                if (!data || data.length === 0) {
                    console.log('No original language data available');
                    return null;
                }
                
                state.versesCache[cacheKey] = data;
                return data;
            } catch (error) {
                console.error('Original language API Error:', error);
                return null;
            }
        }

        // Load notes from localStorage
        function loadNotes() {
            const saved = localStorage.getItem('bible-notes');
            if (saved) {
                state.notes = JSON.parse(saved);
            }
        }

        // Save notes to localStorage
        function saveNotesToStorage() {
            localStorage.setItem('bible-notes', JSON.stringify(state.notes));
        }

        // Load highlights from localStorage
        function loadHighlights() {
            const saved = localStorage.getItem('bible-highlights');
            if (saved) {
                state.highlights = JSON.parse(saved);
            }
        }

        // Save highlights to localStorage
        function saveHighlights() {
            localStorage.setItem('bible-highlights', JSON.stringify(state.highlights));
        }

        // Highlight colors map
        const highlightColors = {
            yellow: 'rgba(251, 191, 36, 0.4)',
            green: 'rgba(34, 197, 94, 0.4)',
            blue: 'rgba(59, 130, 246, 0.4)',
            purple: 'rgba(168, 85, 247, 0.4)',
            pink: 'rgba(236, 72, 153, 0.4)',
            red: 'rgba(239, 68, 68, 0.4)',
            orange: 'rgba(249, 115, 22, 0.4)',
            teal: 'rgba(20, 184, 166, 0.4)',
            cyan: 'rgba(6, 182, 212, 0.4)',
            lime: 'rgba(132, 204, 22, 0.4)'
        };

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '';
            
            if (state.selectedTestament) {
                html += `<span class="text-amber-400">${state.selectedTestament}</span>`;
                
                if (state.selectedBook) {
                    html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                    html += `<span class="text-amber-400">${state.selectedBook.name}</span>`;
                    
                    if (state.selectedChapter) {
                        html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                        html += `<span class="text-amber-400">Chapter ${state.selectedChapter}</span>`;
                    }
                }
            }
            
            breadcrumb.innerHTML = html;
        }

        // Testament selection
        function selectTestament(testament) {
            state.selectedTestament = testament;
            document.getElementById('testament-selection').classList.add('hidden');
            document.getElementById('book-selection').classList.remove('hidden');
            updateBreadcrumb();
            renderBooks();
        }

        function goBackToTestament() {
            state.selectedTestament = null;
            state.selectedBook = null;
            document.getElementById('book-selection').classList.add('hidden');
            document.getElementById('testament-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Book selection
        function renderBooks() {
            const grid = document.getElementById('books-grid');
            const books = state.selectedTestament === 'Old Testament' ? oldTestament : newTestament;
            
            grid.innerHTML = books.map(book => `
                <button onclick='selectBook(${JSON.stringify(book).replace(/'/g, "&#39;")})' class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-4 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50">
                    <div class="font-semibold">${book.name}</div>
                    <div class="text-sm text-slate-400">${book.chapters} chapters</div>
                </button>
            `).join('');
        }

        function selectBook(book) {
            state.selectedBook = book;
            document.getElementById('book-selection').classList.add('hidden');
            document.getElementById('chapter-selection').classList.remove('hidden');
            updateBreadcrumb();
            renderChapters();
        }

        function goBackToBooks() {
            state.selectedBook = null;
            state.selectedChapter = null;
            document.getElementById('chapter-selection').classList.add('hidden');
            document.getElementById('book-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Chapter selection
        function renderChapters() {
            const grid = document.getElementById('chapters-grid');
            const chapters = Array.from({ length: state.selectedBook.chapters }, (_, i) => i + 1);
            
            grid.innerHTML = chapters.map(chapter => `
                <button onclick="selectChapter(${chapter})" class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-3 rounded-lg shadow transition-all border border-slate-600/50 hover:border-amber-500/50 font-semibold">
                    ${chapter}
                </button>
            `).join('');
        }

        function selectChapter(chapter) {
            state.selectedChapter = chapter;
            state.selectedVerse = null;
            document.getElementById('chapter-selection').classList.add('hidden');
            document.getElementById('chapter-view').classList.remove('hidden');
            updateBreadcrumb();
            
            // Set translation selector to current selection
            document.getElementById('translation-select').value = state.selectedTranslation;
            
            renderVerses();
        }

        function goBackToChapters() {
            state.selectedChapter = null;
            state.selectedVerse = null;
            document.getElementById('chapter-view').classList.add('hidden');
            document.getElementById('chapter-selection').classList.remove('hidden');
            updateBreadcrumb();
        }

        // Translation change
        function changeTranslation() {
            const select = document.getElementById('translation-select');
            state.selectedTranslation = select.value;
            renderVerses();
        }

        // Verses rendering
        async function renderVerses() {
            const contentArea = document.getElementById('content-area');
            showLoading();

            // Fetch English translation
            const data = await fetchVerses(state.selectedBook.id, state.selectedChapter, state.selectedTranslation);
            
            // Fetch original language (Hebrew or Greek)
            const originalData = await fetchOriginalLanguage(state.selectedBook.name, state.selectedChapter, state.selectedTestament);

            hideLoading();

            if (!data || !data.verses || data.verses.length === 0) {
                contentArea.innerHTML = `
                    <div class="bg-slate-700/30 border border-slate-600/50 rounded-lg p-8 text-center text-slate-400">
                        <p>Unable to load verses. Please try again.</p>
                    </div>
                `;
                return;
            }

            // Store current verses for notes modal
            state.currentVerses = {};
            data.verses.forEach(v => {
                state.currentVerses[v.verse] = v.text;
            });

            contentArea.innerHTML = `
                <div class="bg-slate-900/50 border border-slate-800/50 rounded-lg p-8 text-slate-200 leading-relaxed text-lg shadow-xl">
                    ${data.verses.map(verse => {
                        const bookName = state.selectedBook.name;
                        const chapterNum = state.selectedChapter;
                        const verseKey = `${bookName}-${chapterNum}-${verse.verse}`;
                        const hasNotes = state.notes[verseKey];
                        const highlight = state.highlights[verseKey];
                        const highlightStyle = highlight ? `background-color: ${highlightColors[highlight]}; padding: 2px 4px; border-radius: 3px;` : '';
                        
                        // Get original language text
                        let originalText = '';
                        if (originalData && Array.isArray(originalData) && originalData[verse.verse - 1]) {
                            const verseData = originalData[verse.verse - 1];
                            originalText = verseData.text || verseData.verse || '';
                        }
                        
                        return `
                            <div class="verse-wrapper">
                                <sup class="verse-number">${verse.verse}</sup>
                                <span class="verse-content ${highlight ? 'verse-highlighted' : ''}" style="${highlightStyle}" data-verse="${verse.verse}">${verse.text}</span>
                                <span class="verse-actions">
                                    <button 
                                        onclick="openHighlightModal(${verse.verse})" 
                                        class="inline-flex items-center justify-center w-5 h-5 rounded hover:bg-slate-700/50 ${highlight ? 'text-amber-400' : 'text-slate-500 hover:text-amber-400'}" 
                                        title="${highlight ? 'Change highlight' : 'Highlight verse'}"
                                    >
                                        <svg class="w-3.5 h-3.5" fill="${highlight ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                        </svg>
                                    </button>
                                    <button 
                                        onclick="openNotesModal(${verse.verse})" 
                                        class="inline-flex items-center justify-center w-5 h-5 rounded hover:bg-slate-700/50 ${hasNotes ? 'text-amber-400' : 'text-slate-500 hover:text-amber-400'}"
                                        title="${hasNotes ? 'Edit notes' : 'Add notes'}"
                                    >
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                        </svg>
                                    </button>
                                </span>
                                ${originalText ? `
                                    <div class="mt-2 ml-6 text-base text-slate-400 italic border-l-2 border-slate-700 pl-3">
                                        <span class="text-xs text-amber-400 font-semibold">${state.selectedTestament === 'Old Testament' ? 'Hebrew' : 'Greek'}:</span>
                                        <span class="font-serif" dir="${state.selectedTestament === 'Old Testament' ? 'rtl' : 'ltr'}">${originalText}</span>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Notes modal functions
        function openNotesModal(verseNum) {
            state.selectedVerse = verseNum;
            const bookName = state.selectedBook.name;
            const chapterNum = state.selectedChapter;
            const verseKey = `${bookName}-${chapterNum}-${verseNum}`;
            
            // Set modal content
            document.getElementById('notes-verse-title').textContent = `Notes - ${bookName} ${chapterNum}:${verseNum}`;
            document.getElementById('notes-verse-text').textContent = state.currentVerses[verseNum] || '';
            document.getElementById('note-textarea').value = state.notes[verseKey] || '';
            
            // Show modal
            document.getElementById('notes-modal').classList.remove('hidden');
        }

        function closeNotesModal() {
            document.getElementById('notes-modal').classList.add('hidden');
            state.selectedVerse = null;
        }

        function saveNote() {
            const textarea = document.getElementById('note-textarea');
            const bookName = state.selectedBook.name;
            const chapterNum = state.selectedChapter;
            const verseKey = `${bookName}-${chapterNum}-${state.selectedVerse}`;
            
            state.notes[verseKey] = textarea.value;
            saveNotesToStorage();
            
            closeNotesModal();
            renderVerses(); // Refresh to show "Has notes" indicator
        }

        // Close modal when clicking outside
        document.getElementById('notes-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeNotesModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeNotesModal();
                closeHighlightModal();
                if (!document.getElementById('notes-modal').classList.contains('hidden')) {
                    return;
                }
                if (document.getElementById('highlights-panel').classList.contains('hidden') === false) {
                    toggleHighlightsPanel();
                }
            }
        });

        // Highlight functions
        function openHighlightModal(verseNum) {
            state.highlightingVerse = verseNum;
            document.getElementById('highlight-modal').classList.remove('hidden');
        }

        function closeHighlightModal() {
            document.getElementById('highlight-modal').classList.add('hidden');
            state.highlightingVerse = null;
        }

        function selectHighlight(color) {
            if (!state.highlightingVerse) return;
            
            const bookName = state.selectedBook.name;
            const chapterNum = state.selectedChapter;
            const verseKey = `${bookName}-${chapterNum}-${state.highlightingVerse}`;
            
            // If same color, remove highlight
            if (state.highlights[verseKey] === color) {
                delete state.highlights[verseKey];
            } else {
                state.highlights[verseKey] = color;
            }
            
            saveHighlights();
            updateHighlightsCount();
            closeHighlightModal();
            renderVerses();
        }

        function updateHighlightsCount() {
            const count = Object.keys(state.highlights).length;
            document.getElementById('highlights-count').textContent = count;
        }

        function toggleHighlightsPanel() {
            const panel = document.getElementById('highlights-panel');
            const isHidden = panel.classList.contains('hidden');
            
            if (isHidden) {
                panel.classList.remove('hidden');
                renderHighlightsPanel();
            } else {
                panel.classList.add('hidden');
            }
        }

        function renderHighlightsPanel() {
            const content = document.getElementById('highlights-content');
            const highlights = Object.entries(state.highlights);
            
            if (highlights.length === 0) {
                content.innerHTML = '<div class="text-slate-400 text-center py-8">No highlighted verses yet</div>';
                return;
            }

            // Group by book
            const grouped = {};
            highlights.forEach(([key, color]) => {
                const [book, chapter, verse] = key.split('-');
                const bookChapter = `${book} ${chapter}`;
                if (!grouped[bookChapter]) {
                    grouped[bookChapter] = [];
                }
                grouped[bookChapter].push({ verse, color, key });
            });

            content.innerHTML = Object.entries(grouped).map(([bookChapter, verses]) => `
                <div class="mb-4">
                    <h4 class="font-bold text-slate-300 mb-2">${bookChapter}</h4>
                    <div class="space-y-2">
                        ${verses.map(v => `
                            <div class="flex items-center gap-2 group">
                                <div class="w-3 h-3 rounded flex-shrink-0" style="background-color: ${highlightColors[v.color]}"></div>
                                <button onclick="goToVerse('${v.key}')" class="flex-1 text-left text-sm text-slate-300 hover:text-white transition-colors">
                                    Verse ${v.verse}
                                </button>
                                <button onclick="removeHighlight('${v.key}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                    </svg>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function removeHighlight(verseKey) {
            delete state.highlights[verseKey];
            saveHighlights();
            updateHighlightsCount();
            renderHighlightsPanel();
            if (state.selectedBook && state.selectedChapter) {
                renderVerses();
            }
        }

        function goToVerse(verseKey) {
            const [bookName, chapter, verse] = verseKey.split('-');
            
            // Find the book
            const allBooks = [...oldTestament, ...newTestament];
            const book = allBooks.find(b => b.name === bookName);
            
            if (!book) return;
            
            // Set testament
            state.selectedTestament = oldTestament.includes(book) ? 'Old Testament' : 'New Testament';
            
            // Navigate to the verse
            state.selectedBook = book;
            state.selectedChapter = parseInt(chapter);
            
            // Hide all sections
            document.getElementById('testament-selection').classList.add('hidden');
            document.getElementById('book-selection').classList.add('hidden');
            document.getElementById('chapter-selection').classList.add('hidden');
            document.getElementById('chapter-view').classList.remove('hidden');
            
            updateBreadcrumb();
            document.getElementById('translation-select').value = state.selectedTranslation;
            
            toggleHighlightsPanel();
            
            renderVerses().then(() => {
                // Scroll to verse
                setTimeout(() => {
                    const verseElement = document.querySelector(`[data-verse="${verse}"]`);
                    if (verseElement) {
                        verseElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        // Flash the verse
                        verseElement.style.transition = 'all 0.3s';
                        verseElement.style.transform = 'scale(1.05)';
                        setTimeout(() => {
                            verseElement.style.transform = 'scale(1)';
                        }, 300);
                    }
                }, 100);
            });
        }

        // Close highlight modal when clicking outside
        document.getElementById('highlight-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeHighlightModal();
            }
        });
        eruda.init()
    </script>
</body>
</html>
